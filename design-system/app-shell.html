<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave Manager – App shell</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="prototype-utils.css">
  <style>
    .shell { display: flex; flex-direction: column; min-height: 100vh; }
    .shell-header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--color-bg); border-bottom: var(--border-width) solid var(--color-border); }
    .shell-brand { display: inline-flex; align-items: center; min-height: var(--size-control-lg, 3rem); font-weight: var(--font-weight-bold); color: var(--color-fg); text-decoration: none; margin-right: auto; }
    .shell-nav { flex-basis: 100%; order: 3; }
    .shell-nav-list { display: flex; flex-direction: column; gap: var(--space-1); margin: 0; padding: 0; list-style: none; }
    .shell-link { display: flex; align-items: center; min-height: var(--size-control-lg, 3rem); padding: 0 var(--space-2); border-radius: var(--radius-md); color: var(--color-fg); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); text-decoration: none; }
    .shell-link:hover { background: var(--color-surface); }
    .shell-link[aria-current="page"] { background: var(--color-primary-subtle); color: var(--color-primary-subtle-fg); }
    .shell-main { flex: 1 0 auto; width: 100%; max-width: var(--size-content); margin-inline: auto; padding: var(--space-4) var(--space-3); min-width: 0; }
    .shell-footer { padding: var(--space-3); border-top: var(--border-width) solid var(--color-border); background: var(--color-surface); color: var(--color-fg-muted); font-size: var(--font-size-sm); }
    .shell-footer a { display: inline-flex; align-items: center; min-height: var(--size-control-lg, 3rem); padding: 0 var(--space-2); color: var(--color-fg-muted); }
    .shell-footer-nav { display: flex; flex-wrap: wrap; gap: var(--space-1); }
    .shell-menu-btn { display: inline-flex; width: var(--size-control-lg, 3rem); min-height: var(--size-control-lg, 3rem); }
    @media (min-width: 48em) {
      .shell-header { flex-wrap: nowrap; gap: var(--space-4); padding-inline: var(--space-4); }
      .shell-brand { margin-right: 0; }
      .shell-menu-btn { display: none; }
      .shell-nav { display: block !important; flex: 1 1 auto; order: 0; }
      .shell-nav-list { flex-direction: row; }
      .shell-main { padding: var(--space-5) var(--space-4); }
    }
    @media (max-width: 47.99em) {
      .shell-nav.is-open { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="shell" data-arc-shell>
    <header class="shell-header" data-arc-shell-part="header">
      <a class="shell-brand" href="#">Leave Manager</a>
      <button class="btn btn-secondary btn-icon shell-menu-btn" type="button" data-toggle="main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Menu">&#9776;</button>
      <nav class="shell-nav" id="main-nav" data-arc-shell-part="nav" aria-label="Main" hidden>
        <ul class="shell-nav-list">
          <li><a class="shell-link" href="#" data-nav-key="overview">Overview</a></li>
          <li><a class="shell-link" href="#" data-nav-key="my-leave">My leave</a></li>
          <li><a class="shell-link" href="#" data-nav-key="calendar">Team calendar</a></li>
          <li><a class="shell-link" href="#" data-nav-key="approvals">Approvals</a></li>
          <li><a class="shell-link" href="#" data-nav-key="account">Account</a></li>
        </ul>
      </nav>
    </header>
    <main class="shell-main" id="content" data-arc-content></main>
    <footer class="shell-footer" data-arc-shell-part="footer">
      <div class="cluster between">
        <span>Leave Manager</span>
        <nav class="shell-footer-nav" aria-label="Footer"><a href="#">Leave policy</a><a href="#">Help</a></nav>
      </div>
    </footer>
  </div>
</body>
</html>
